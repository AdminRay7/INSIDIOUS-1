<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIDIOUS | Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        background:radial-gradient(circle at 30% 20%,#1a0000 0%,#0a0000 40%,#000 100%);
        color:#eaeaea;
        font-family:'Segoe UI',system-ui,sans-serif;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        overflow-x:hidden;
    }
    body::before{
        content:'';
        position:fixed;
        inset:0;
        background:
            radial-gradient(circle at 80% 90%,rgba(255,0,0,.12),transparent 50%),
            radial-gradient(circle at 10% 80%,rgba(255,0,0,.08),transparent 40%);
        pointer-events:none;
        animation:flicker 6s infinite alternate;
    }
    @keyframes flicker{
        0%,100%{opacity:.9}
        45%{opacity:.6}
        55%{opacity:1}
    }
    .card{
        position:relative;
        background:rgba(12,0,0,.85);
        backdrop-filter:blur(20px);
        border:1px solid rgba(255,0,0,.35);
        box-shadow:
            0 0 40px rgba(255,0,0,.25),
            inset 0 0 60px rgba(255,0,0,.05);
        border-radius:22px;
        padding:40px 32px;
        max-width:480px;
        width:100%;
        z-index:2;
    }
    .card::before,.card::after{
        content:'';
        position:absolute;
        width:24px;height:24px;
        border:2px solid #ff2a2a;
        box-shadow:0 0 12px #ff2a2a;
    }
    .card::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:22px 0 0 0}
    .card::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 22px 0}

    .brand{
        text-align:center;
        margin-bottom:30px;
    }
    .brand .ghost{
        font-size:44px;
        color:#ff2a2a;
        text-shadow:0 0 24px #ff2a2a;
        animation:pulse 2.5s infinite;
    }
    @keyframes pulse{
        0%,100%{transform:scale(1);opacity:1}
        50%{transform:scale(1.08);opacity:.85}
    }
    .brand h1{
        font-size:26px;
        letter-spacing:6px;
        margin-top:10px;
        color:#fff;
        text-shadow:0 0 20px rgba(255,42,42,.6);
    }
    .brand p{
        color:#888;
        font-size:12px;
        letter-spacing:2px;
        margin-top:6px;
        text-transform:uppercase;
    }

    .status-badge{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:14px;
        border-radius:14px;
        background:rgba(255,0,0,.06);
        border:1px solid rgba(255,0,0,.25);
        margin-bottom:24px;
        font-weight:600;
        letter-spacing:1px;
    }
    .status-badge.online{background:rgba(0,255,100,.06);border-color:rgba(0,255,100,.35);color:#6fff9b}
    .status-badge.offline{background:rgba(255,50,50,.08);border-color:rgba(255,50,50,.35);color:#ff7676}
    .status-badge .dot{
        width:10px;height:10px;border-radius:50%;
        background:#666;
    }
    .status-badge.online .dot{background:#6fff9b;box-shadow:0 0 10px #6fff9b;animation:blink 1.4s infinite}
    .status-badge.offline .dot{background:#ff7676;box-shadow:0 0 10px #ff7676}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .stats{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
        margin-bottom:24px;
    }
    .stat{
        background:rgba(255,255,255,.02);
        border:1px solid rgba(255,255,255,.06);
        border-radius:14px;
        padding:14px;
        text-align:center;
    }
    .stat .label{
        font-size:10px;
        letter-spacing:2px;
        color:#888;
        text-transform:uppercase;
        margin-bottom:6px;
    }
    .stat .value{
        font-size:18px;
        font-weight:700;
        color:#fff;
    }
    .stat .value.green{color:#6fff9b}
    .stat .value.red{color:#ff7676}

    .btn-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
    }
    .btn{
        padding:14px;
        border:none;
        border-radius:12px;
        font-weight:700;
        letter-spacing:1px;
        text-transform:uppercase;
        font-size:12px;
        cursor:pointer;
        transition:.25s;
        color:#000;
        background:#ff2a2a;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,42,42,.4)}
    .btn.ghost{
        background:transparent;
        border:1px solid rgba(255,42,42,.5);
        color:#ff7676;
    }
    .btn.ghost:hover{background:rgba(255,42,42,.1)}

    .footer{
        text-align:center;
        color:#555;
        font-size:10px;
        letter-spacing:3px;
        margin-top:26px;
    }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="ghost"><i class="fas fa-ghost"></i></div>
        <h1>INSIDIOUS</h1>
        <p id="botNameLabel">WhatsApp Automation</p>
    </div>

    <div class="status-badge offline" id="statusBadge">
        <span class="dot"></span>
        <span id="statusText">Checking...</span>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="label">Uptime</div>
            <div class="value" id="uptime">—</div>
        </div>
        <div class="stat">
            <div class="label">Status</div>
            <div class="value red" id="connState">—</div>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="location.reload()">
            <i class="fas fa-sync"></i> Refresh
        </button>
        <button class="btn ghost" onclick="pingBot()">
            <i class="fas fa-bolt"></i> Test
        </button>
    </div>

    <div class="footer">DEVELOPED BY STANYTZ © 2025</div>
</div>

<script>
    function formatUptime(s){
        const d = Math.floor(s/86400);
        const h = Math.floor((s%86400)/3600);
        const m = Math.floor((s%3600)/60);
        const sec = Math.floor(s%60);
        if (d) return `${d}d ${h}h ${m}m`;
        if (h) return `${h}h ${m}m ${sec}s`;
        if (m) return `${m}m ${sec}s`;
        return `${sec}s`;
    }

    async function refresh(){
        try{
            const r = await fetch('/api/status',{cache:'no-store'});
            const s = await r.json();
            const badge = document.getElementById('statusBadge');
            const text  = document.getElementById('statusText');
            const conn  = document.getElementById('connState');
            const up    = document.getElementById('uptime');

            up.textContent = formatUptime(s.uptime || 0);
            if (s.botName) document.getElementById('botNameLabel').textContent = s.botName;

            if (s.connected){
                badge.classList.remove('offline');
                badge.classList.add('online');
                text.textContent = 'ONLINE';
                conn.textContent = 'Connected';
                conn.classList.remove('red');
                conn.classList.add('green');
            } else {
                badge.classList.remove('online');
                badge.classList.add('offline');
                text.textContent = 'OFFLINE';
                conn.textContent = 'Offline';
                conn.classList.remove('green');
                conn.classList.add('red');
            }
        }catch(e){
            document.getElementById('statusText').textContent = 'Server unreachable';
        }
    }

    async function pingBot(){
        const btn = event.target.closest('button');
        const old = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Pinging...';
        const t0 = Date.now();
        try{
            await fetch('/api/status',{cache:'no-store'});
            const ms = Date.now()-t0;
            btn.innerHTML = `<i class="fas fa-check"></i> ${ms}ms`;
        }catch{
            btn.innerHTML = '<i class="fas fa-xmark"></i> Failed';
        }
        setTimeout(()=>btn.innerHTML=old,2000);
    }

    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
