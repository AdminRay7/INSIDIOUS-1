<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIDIOUS | Pairing Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        background:radial-gradient(circle at 30% 20%,#1a0000 0%,#0a0000 40%,#000 100%);
        color:#eaeaea;
        font-family:'Segoe UI',system-ui,sans-serif;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        overflow-x:hidden;
    }
    body::before{
        content:'';
        position:fixed;inset:0;
        background:
            radial-gradient(circle at 80% 90%,rgba(255,0,0,.12),transparent 50%),
            radial-gradient(circle at 10% 80%,rgba(255,0,0,.08),transparent 40%);
        pointer-events:none;
    }
    .card{
        position:relative;
        background:rgba(12,0,0,.85);
        backdrop-filter:blur(20px);
        border:1px solid rgba(255,0,0,.35);
        box-shadow:0 0 40px rgba(255,0,0,.25),inset 0 0 60px rgba(255,0,0,.05);
        border-radius:22px;
        padding:40px 32px;
        max-width:480px;
        width:100%;
        z-index:2;
    }
    .card::before,.card::after{
        content:'';
        position:absolute;
        width:24px;height:24px;
        border:2px solid #ff2a2a;
        box-shadow:0 0 12px #ff2a2a;
    }
    .card::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:22px 0 0 0}
    .card::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 22px 0}

    .brand{text-align:center;margin-bottom:26px}
    .brand .ghost{
        font-size:44px;color:#ff2a2a;
        text-shadow:0 0 24px #ff2a2a;
        animation:pulse 2.5s infinite;
    }
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
    .brand h1{font-size:24px;letter-spacing:6px;margin-top:10px;color:#fff;text-shadow:0 0 20px rgba(255,42,42,.6)}
    .brand p{color:#888;font-size:11px;letter-spacing:2px;margin-top:6px;text-transform:uppercase}

    .input-area{margin-top:20px}
    .input-area p{font-size:13px;color:#ccc;text-align:center;margin-bottom:10px}

    input{
        width:100%;
        padding:16px;
        background:#0a0000;
        border:1px solid rgba(255,42,42,.4);
        border-radius:12px;
        color:#fff;
        font-size:16px;
        text-align:center;
        letter-spacing:2px;
        outline:none;
        transition:.2s;
    }
    input:focus{border-color:#ff2a2a;box-shadow:0 0 20px rgba(255,42,42,.4)}

    button{
        width:100%;
        padding:16px;
        margin-top:12px;
        border:none;
        border-radius:12px;
        background:#ff2a2a;
        color:#000;
        font-weight:800;
        letter-spacing:2px;
        text-transform:uppercase;
        font-size:13px;
        cursor:pointer;
        transition:.25s;
    }
    button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,42,42,.45)}
    button:disabled{opacity:.5;cursor:not-allowed}

    #pair-container{margin-top:20px;display:none}

    .code{
        font-size:36px;
        font-weight:800;
        letter-spacing:10px;
        text-align:center;
        color:#fff;
        background:#000;
        padding:24px 12px;
        border-radius:14px;
        border:1px dashed rgba(255,42,42,.6);
        margin:18px 0;
        text-shadow:0 0 20px rgba(255,42,42,.8);
        word-break:break-all;
    }

    .instructions{
        background:rgba(255,42,42,.06);
        border-left:3px solid #ff2a2a;
        padding:14px 16px;
        border-radius:8px;
        font-size:13px;
        color:#ccc;
        line-height:1.7;
    }
    .instructions b{color:#ff7676}

    .error{
        color:#ff7676;
        font-size:13px;
        text-align:center;
        margin-top:12px;
        display:none;
    }

    .footer{
        text-align:center;
        color:#555;
        font-size:10px;
        letter-spacing:3px;
        margin-top:26px;
    }

    @media(max-width:480px){
        .card{padding:30px 20px}
        h1{font-size:20px}
        .code{font-size:26px;letter-spacing:6px;padding:18px 10px}
    }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="ghost"><i class="fas fa-ghost"></i></div>
        <h1>INSIDIOUS</h1>
        <p>WhatsApp Pairing Panel</p>
    </div>

    <div class="input-area" id="input-area">
        <p>Enter phone number with country code</p>
        <input type="tel" id="phone" placeholder="254712345678" inputmode="numeric" autocomplete="off">
        <button id="genBtn">Generate Pairing Code</button>
        <div class="error" id="err"></div>
    </div>

    <div id="pair-container">
        <div class="instructions">
            <b>HOW TO PAIR:</b><br>
            1. Open WhatsApp → <b>Linked Devices</b><br>
            2. Tap <b>Link with Phone Number</b><br>
            3. Enter the 8-digit code below
        </div>
        <div class="code" id="pairCode">----</div>
    </div>

    <div class="footer">DEVELOPED BY STANYTZ © 2025</div>
</div>

<script>
const genBtn   = document.getElementById('genBtn');
const phone    = document.getElementById('phone');
const inputArea = document.getElementById('input-area');
const pairBox  = document.getElementById('pair-container');
const pairCode = document.getElementById('pairCode');
const err      = document.getElementById('err');

genBtn.onclick = async () => {
    err.style.display = 'none';

    const num = phone.value.replace(/\D/g, '');
    if (num.length < 10 || num.length > 15) {
        err.innerText = 'Enter full number with country code (10–15 digits)';
        err.style.display = 'block';
        return;
    }

    genBtn.disabled = true;
    genBtn.innerText = 'GENERATING...';

    try {
        const r = await fetch(`/api/pair?num=${encodeURIComponent(num)}`, { cache: 'no-store' });
        const data = await r.json();

        if (!r.ok || data.error) {
            throw new Error(data.error || `Server error ${r.status}`);
        }

        if (!data.code) {
            throw new Error('No pairing code returned');
        }

        pairCode.innerText = data.code;
        pairBox.style.display = 'block';
        genBtn.innerText = 'CODE GENERATED';
        // Button stays disabled — user has their code

    } catch (e) {
        err.innerText = e.message;
        err.style.display = 'block';
        genBtn.disabled = false;
        genBtn.innerText = 'Generate Pairing Code';
    }
};
</script>
</body>
</html>
